name: Generate Profile Metrics

on:
  schedule:
    # Runs every 6 hours
    - cron: "0 */6 * * *"
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  metrics:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write

    steps:
      - name: Overview
        uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.METRICS_TOKEN || secrets.GITHUB_TOKEN }}
          user: JohnFilhmar
          filename: overview.svg
          committer_branch: metrics
          committer_message: "chore: update overview metrics"
          template: classic
          base: header, activity, community, repositories, metadata
          config_timezone: Asia/Manila
          config_display: regular
          config_animations: yes
          use_prebuilt_image: yes

      - name: Languages
        uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.METRICS_TOKEN || secrets.GITHUB_TOKEN }}
          user: JohnFilhmar
          filename: languages.svg
          committer_branch: metrics
          committer_message: "chore: update language metrics"
          template: classic
          base: ""
          config_timezone: Asia/Manila
          config_display: regular
          plugin_languages: yes
          plugin_languages_limit: 8
          plugin_languages_details: bytes-size, percentage
          plugin_languages_sections: most-used
          use_prebuilt_image: yes

      - name: Isometric calendar
        uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.METRICS_TOKEN || secrets.GITHUB_TOKEN }}
          user: JohnFilhmar
          filename: calendar.svg
          committer_branch: metrics
          committer_message: "chore: update calendar metrics"
          template: classic
          base: ""
          config_timezone: Asia/Manila
          config_display: large
          plugin_isocalendar: yes
          plugin_isocalendar_duration: full-year
          use_prebuilt_image: yes

      - name: Achievements
        uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.METRICS_TOKEN || secrets.GITHUB_TOKEN }}
          user: JohnFilhmar
          filename: achievements.svg
          committer_branch: metrics
          committer_message: "chore: update achievement metrics"
          template: classic
          base: ""
          config_timezone: Asia/Manila
          config_display: large
          plugin_achievements: yes
          plugin_achievements_display: compact
          plugin_achievements_secrets: yes
          plugin_achievements_threshold: C
          use_prebuilt_image: yes
